services:
  - type: web
    name: loanchatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          name: loanchatbot-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - type: redis
    name: loanchatbot-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
